# ============================================================================
#  MineStormBan - config.yml
#  Created by Muvixo
#  Run every backend AND the proxy against the SAME MySQL database
#  for network-wide bans.
# ============================================================================

server-id: lobby-1
database:
  type: sqlite
  table-prefix: msban_
  fail-open: true
  sqlite:
    file: minestormban.db
  mysql:
    host: 127.0.0.1
    port: 3306
    database: minestormban
    username: minestormban
    password: change-me
    use-ssl: false
    pool-size: 8
    connection-timeout-ms: 10000
sync:
  poll-interval-seconds: 5
timezone: UTC
date-format: dd/MM/yyyy HH:mm:ss
defaults:
  ban-reason: Violating the server rules
  mute-reason: Violating the chat rules
  kick-reason: Kicked by a staff member
limits:
  max-duration: 5y
announcements:
  ban: true
  mute: true
  kick: true
  unban: true
  unmute: true
mute:
  blocked-commands:
  - msg
  - tell
  - w
  - whisper
  - r
  - reply
  - me
  - say
  - mail
  - t
  - pm
