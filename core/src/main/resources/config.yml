# ============================================================================
#  ApexBan - config.yml
#  Shared by the Bukkit/Spigot/Paper, BungeeCord and Velocity builds.
#  Run every server (and the proxy) against the SAME database to share bans.
# ============================================================================

# Unique name of this server/proxy. Stored with every punishment so staff can
# see where it was issued; it is available as %server% in messages and layouts.
server-id: "lobby-1"

# ----------------------------------------------------------------------------
#  Database
# ----------------------------------------------------------------------------
database:
  # "sqlite" - single file, best for one standalone server.
  # "mysql"  - MySQL / MariaDB, REQUIRED for networks (proxy + backends).
  type: "sqlite"

  # Prefix for table names. Letters, digits and underscores only.
  table-prefix: "apexban_"

  # When the database is unreachable during login:
  #   true  -> let the player in (recommended, avoids locking everyone out)
  #   false -> deny the login with the "login.database-error" message
  fail-open: true

  sqlite:
    # File inside the plugin folder.
    file: "apexban.db"

  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "apexban"
    username: "apexban"
    password: "change-me"
    use-ssl: false
    pool-size: 8
    connection-timeout-ms: 10000

# ----------------------------------------------------------------------------
#  Cross-server synchronisation
# ----------------------------------------------------------------------------
sync:
  # How often (seconds) this server checks the database for punishments issued
  # elsewhere, so online players are kicked/muted/unmuted network-wide.
  # Keep the clocks of all servers synchronised (NTP) for best results.
  poll-interval-seconds: 5

# ----------------------------------------------------------------------------
#  Time & date formatting (used for %expires% and %date%)
# ----------------------------------------------------------------------------
# Any IANA zone id, e.g. "UTC", "Europe/Amsterdam", "America/New_York".
timezone: "UTC"
# java.time.DateTimeFormatter pattern.
date-format: "dd/MM/yyyy HH:mm:ss"

# ----------------------------------------------------------------------------
#  Default reasons (used when the command is run without a reason)
# ----------------------------------------------------------------------------
defaults:
  ban-reason: "Violating the server rules"
  mute-reason: "Violating the chat rules"
  kick-reason: "Kicked by a staff member"

# ----------------------------------------------------------------------------
#  Limits
# ----------------------------------------------------------------------------
limits:
  # Longest allowed temporary punishment. Omit the duration to go permanent.
  # Units: s, m (minutes), h, d, w, mo (30 days), y (365 days). e.g. "1d12h"
  max-duration: "5y"

# ----------------------------------------------------------------------------
#  Announcements
#  true  -> broadcast to everyone on this server
#  false -> only players with apexban.notify (and the console) see it
#  Using the -s flag (e.g. /ban -s Steve) always keeps it staff-only and
#  requires the apexban.silent permission.
# ----------------------------------------------------------------------------
announcements:
  ban: true
  mute: true
  kick: true
  unban: true
  unmute: true

# ----------------------------------------------------------------------------
#  Mute behaviour
# ----------------------------------------------------------------------------
mute:
  # Commands that muted players may NOT use (without the leading slash).
  blocked-commands:
    - "msg"
    - "tell"
    - "w"
    - "whisper"
    - "r"
    - "reply"
    - "me"
    - "say"
    - "mail"
    - "t"
    - "pm"
