# ============================================================================
#  MineStormBan - config.yml
#  Created by Muvixo
#  Shared by the Bukkit/Spigot/Paper, BungeeCord and Velocity builds.
#
#  Keys that are missing from this file are added automatically on start-up
#  and on /msban reload (a backup is saved as config.yml.bak).
# ============================================================================

# Unique name of THIS server / proxy.
# IMPORTANT: every server that uses the same database needs a DIFFERENT id.
# Server-scoped bans and mutes are tied to this id.
server-id: server-1

# ----------------------------------------------------------------------------
#  Where punishments are enforced
# ----------------------------------------------------------------------------
#  server -> a ban/mute only works on the server where it was issued
#            (you ban a player on "survival": he can still join "lobby")
#  global -> a ban/mute works on every server that shares the database
#
#  In-game overrides:  /ban -g <player>   = global     /ban -l <player> = this server only
#  /unban only removes what applies on this server; /unban -g removes it everywhere.
#  The -g flag needs the permission minestormban.global.
scope:
  ban: server
  mute: server

# ----------------------------------------------------------------------------
#  Database
# ----------------------------------------------------------------------------
database:
  # "sqlite" - single file, best for one standalone server.
  # "mysql"  - MySQL / MariaDB, REQUIRED when several servers share punishments.
  type: sqlite

  # Prefix for table names. Letters, digits and underscores only.
  table-prefix: msban_

  # Auto-missing: create missing tables, add missing columns and indexes, and
  # repair the schema on the fly if something disappears while running.
  auto-repair: true

  # When the database is unreachable during login:
  #   true  -> let the player in (recommended)
  #   false -> deny the login with the "login.database-error" message
  fail-open: true

  sqlite:
    file: minestormban.db
  mysql:
    host: 127.0.0.1
    port: 3306
    database: minestormban
    username: minestormban
    password: change-me
    use-ssl: false
    pool-size: 8
    connection-timeout-ms: 10000

# ----------------------------------------------------------------------------
#  Cross-server synchronisation
# ----------------------------------------------------------------------------
sync:
  # How often (seconds) this server checks the database for punishments issued
  # elsewhere, so online players are kicked/muted/unmuted without relogging.
  poll-interval-seconds: 5

# ----------------------------------------------------------------------------
#  Time & date formatting
# ----------------------------------------------------------------------------
timezone: UTC
date-format: dd/MM/yyyy HH:mm:ss

# ----------------------------------------------------------------------------
#  Default reasons
# ----------------------------------------------------------------------------
defaults:
  ban-reason: Violating the server rules
  mute-reason: Violating the chat rules
  kick-reason: Kicked by a staff member

# ----------------------------------------------------------------------------
#  Limits
# ----------------------------------------------------------------------------
limits:
  max-duration: 5y

# ----------------------------------------------------------------------------
#  Announcements (false = only staff with minestormban.notify see it)
# ----------------------------------------------------------------------------
announcements:
  ban: true
  mute: true
  kick: true
  unban: true
  unmute: true

# ----------------------------------------------------------------------------
#  Mute behaviour
# ----------------------------------------------------------------------------
mute:
  blocked-commands:
    - msg
    - tell
    - w
    - whisper
    - r
    - reply
    - me
    - say
    - mail
    - t
    - pm
